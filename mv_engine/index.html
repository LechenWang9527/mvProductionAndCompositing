<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mv_engine - deterministic Canvas 2D MV renderer</title>
<style>
  html, body { margin: 0; height: 100%; background: #05070d; color: #eaf2ff;
               font: 14px/1.6 ui-sans-serif, system-ui, "Segoe UI", "Microsoft YaHei", sans-serif; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 18px; box-sizing: border-box; }
  #stage { position: relative; box-shadow: 0 18px 60px rgba(0,0,0,.65); border-radius: 6px; overflow: hidden; }
  canvas { display: block; }
  body.export { display: block; padding: 0; background: #000; }
  body.export #ui { display: none; }
  body.export #stage { box-shadow: none; border-radius: 0; }
  #ui { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; justify-content: center; max-width: 960px; }
  button { background: #0d1522; color: #cfe0f5; border: 1px solid #24405c; border-radius: 4px;
           padding: 5px 12px; font: inherit; cursor: pointer; }
  button:hover { border-color: #5eead4; color: #fff; }
  #seek { flex: 1; min-width: 240px; accent-color: #5eead4; }
  #clock { font-variant-numeric: tabular-nums; color: #93a6c0; min-width: 92px; text-align: right; }
  #status { color: #6f8299; font-size: 12px; max-width: 900px; text-align: center; }
  #status.err { color: #ff8095; }
</style>
</head>
<body>
<div id="stage"><canvas id="view"></canvas></div>
<div id="ui">
  <button id="play" disabled>play</button>
  <input id="seek" type="range" min="0" max="1" step="0.001" value="0" disabled>
  <span id="clock">0.000 / 0.000</span>
</div>
<div id="status">loading…</div>
<audio id="audio" preload="auto"></audio>
<script type="module" src="src/main.js"></script>
</body>
</html>
